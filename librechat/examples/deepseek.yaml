# Example librechat.yaml: DeepSeek with selectable reasoning levels
#
# Copy the content of this file to librechat.yaml in the add-on config folder
# (the folder that also holds your .env; container path /config/librechat.yaml)
# and set DEEPSEEK_API_KEY in that .env, then restart the add-on.
#
# Notes:
# - Config version must match the one documented for the bundled LibreChat
#   release (1.3.16 for v0.8.8-rc3).
# - Model specs reference a custom endpoint by its name exactly as defined
#   under endpoints.custom ("DeepSeek" here), not by "custom".
# - reasoning_effort values DeepSeek accepts: none, low, high, max
#   (thinking is on by default; "none" disables it entirely).

version: 1.3.16
cache: true

endpoints:
  custom:
    - name: "DeepSeek"
      apiKey: "${DEEPSEEK_API_KEY}"
      baseURL: "https://api.deepseek.com"
      models:
        default:
          - "deepseek-flash"
          - "deepseek-v4-pro"
        fetch: false
      titleConvo: true
      titleModel: "deepseek-flash"
      modelDisplayLabel: "DeepSeek"
      customParams:
        reasoningFormat: "reasoning_effort"
        reasoningKey: "reasoning_content"

modelSpecs:
  list:
    - name: "ds-flash-low"
      label: "DeepSeek Flash (Schnell / Low)"
      description: "Geringer Reasoning-Aufwand – maximale Geschwindigkeit."
      group: "DeepSeek"
      preset:
        endpoint: "DeepSeek"
        model: "deepseek-flash"
        reasoning_effort: "low"

    - name: "ds-flash-high"
      label: "DeepSeek Flash (High)"
      description: "Hoher Reasoning-Aufwand (DeepSeek-Standard)."
      group: "DeepSeek"
      preset:
        endpoint: "DeepSeek"
        model: "deepseek-flash"
        reasoning_effort: "high"

    - name: "ds-flash-max"
      label: "DeepSeek Flash (Deep Think / Max)"
      description: "Maximale Denk-Intensität (bis zu 128K Output-Token)."
      group: "DeepSeek"
      preset:
        endpoint: "DeepSeek"
        model: "deepseek-flash"
        reasoning_effort: "max"

    - name: "ds-v4-pro"
      label: "DeepSeek V4 Pro"
      description: "Pro-Modell ohne feste Reasoning-Stufe (API-Standard)."
      group: "DeepSeek"
      preset:
        endpoint: "DeepSeek"
        model: "deepseek-v4-pro"
