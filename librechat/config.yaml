# https://developers.home-assistant.io/docs/add-ons/configuration
name: LibreChat
slug: librechat
version: "0.8.8-ha5"
description: Open-source AI chat platform (LibreChat) with built-in FerretDB (MongoDB-compatible) storage, Meilisearch and an admin panel, running fully locally
url: "https://github.com/schlangeweile/ha-addon-librechat/tree/master/librechat"
arch:
  - aarch64
  - amd64
init: false

# Cold backups: the Supervisor defaults to hot backups, which would copy the
# live PostgreSQL cluster and Meilisearch LMDB on /data while the add-on is
# writing. Cold mode stops the add-on briefly and keeps the backup consistent.
backup: cold
# s6 and PostgreSQL need more than the Supervisor's 10 s default to stop.
timeout: 30

ports:
  3080/tcp: 3080
  3081/tcp: 3081

# Renders the "Open Web UI" button on the add-on page.
webui: "http://[HOST]:[PORT:3080]"

map:
  - addon_config:rw
image: "ghcr.io/schlangeweile/{arch}-addon-librechat"
