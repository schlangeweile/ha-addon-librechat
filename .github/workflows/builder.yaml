name: Build add-on images

on:
  push:
    branches:
      - master
    paths:
      - "librechat/**"
      - ".github/workflows/builder.yaml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  validate:
    name: Validate version pins
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@v6.0.1

      - name: 🔍 Check LibreChat version pin
        shell: bash
        run: |
          set -euo pipefail
          cfg=$(sed -nE 's/^version:[[:space:]]*"([0-9]+\.[0-9]+\.[0-9]+(-rc[0-9]+)?)-ha[0-9]+"$/\1/p' librechat/config.yaml)
          args=$(sed -nE 's/^ARG LIBRECHAT_VERSION=v([0-9]+\.[0-9]+\.[0-9]+(-rc[0-9]+)?)$/\1/p' librechat/Dockerfile | sort -u)

          if [ -z "$cfg" ] || [ -z "$args" ]; then
            echo "::error::Could not parse the LibreChat version (config.yaml='${cfg}', Dockerfile='${args}'). Expected <X.Y.Z>[-rcN]-ha<N> in config.yaml and ARG LIBRECHAT_VERSION=v<X.Y.Z>[-rcN] in the Dockerfile."
            exit 1
          fi

          arg_count=$(printf '%s\n' "$args" | wc -l)
          if [ "$arg_count" -ne 1 ]; then
            echo "::error::Dockerfile has conflicting LIBRECHAT_VERSION ARG defaults: $(printf '%s ' $args)"
            exit 1
          fi
          arg=$args

          if [ "$cfg" != "$arg" ]; then
            echo "::error::Version mismatch: config.yaml pins LibreChat '${cfg}', Dockerfile LIBRECHAT_VERSION is '${arg}'. Bump both together."
            exit 1
          fi

          echo "Version pin OK: LibreChat ${cfg}"

  build:
    name: Build ${{ matrix.arch }} add-on image
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: ["aarch64", "amd64"]
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@v6.0.1

      - name: 🔧 Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: 🔑 Login to GitHub Container Registry
        uses: docker/login-action@v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🚀 Build and push ${{ matrix.arch }} add-on image
        uses: home-assistant/builder@2026.02.1
        with:
          args: |
            --${{ matrix.arch }} \
            --target /data/librechat \
            --image "{arch}-addon-librechat" \
            --docker-hub "ghcr.io/schlangeweile" \
            --addon
